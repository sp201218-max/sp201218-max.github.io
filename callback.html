<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign-in code</title>
<style>
  body { font: 17px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1b1b1b; background: #fff; }
  textarea { width: 100%; height: 120px; font: 14px monospace; padding: 8px; box-sizing: border-box; }
  button { font-size: 17px; padding: 8px 18px; margin-top: 8px; cursor: pointer; }
  .err { color: #a40000; }
</style>
</head>
<body>
<h1>Almost done</h1>
<p id="msg">Copy the text below, go back to the PowerShell window, paste it and press Enter.</p>
<textarea id="out" readonly></textarea>
<button id="copy">Copy</button>
<p>This page only shows the address it was opened with. It sends nothing anywhere.</p>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('out').value = location.href;
  if (q.get('error')) {
    document.getElementById('msg').className = 'err';
    document.getElementById('msg').textContent = 'Sign-in was cancelled or refused: ' + q.get('error') + ' ' + (q.get('error_description') || '');
  }
  document.getElementById('copy').onclick = function () {
    var t = document.getElementById('out'); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).catch(function () { document.execCommand('copy'); });
    this.textContent = 'Copied';
  };
</script>
</body>
</html>
